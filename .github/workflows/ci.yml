name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Screenshot baselines exist for darwin only. Desktop e2e needs the API and
      # Postgres, so it runs in the e2e job.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # macOS needs no system packages, so no --with-deps; a cache hit makes this a no-op.
      - run: pnpm --filter @dlh/ui exec playwright install webkit chromium

      - run: pnpm --filter @dlh/ui test:screens

  # The Tauri build runs beside the checks instead of after them: it is the
  # slowest step, and needs nothing the checks produce.
  desktop-build:
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Save the cache even when the job fails, or a red run leaves every later
      # run compiling all crates from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # Pull requests check that the app compiles with a fast debug build;
      # pushes to main still build release. tauri runs build:web first
      # (beforeBuildCommand).
      - run: pnpm --filter @dlh/desktop exec tauri build --no-bundle ${{ github.event_name == 'pull_request' && '--debug' || '' }}

      # The OAuth loopback, CLI resolve and process-kill tests. Runs after the
      # build, which writes the dist folder the Tauri context embeds.
      - run: pnpm --filter @dlh/desktop test:rust

  # The server side runs as three jobs in parallel on Linux: the database tests,
  # the desktop e2e (one job per browser) and the Docker images and tests.
  db:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://dlh:dlh@127.0.0.1:54329/dlh_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlh
          POSTGRES_PASSWORD: dlh
          POSTGRES_DB: dlh
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dlh -d dlh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  e2e:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlh
          POSTGRES_PASSWORD: dlh
          POSTGRES_DB: dlh
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dlh -d dlh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --with-deps still installs the system packages; the browser download is
      # skipped on a cache hit.
      - run: pnpm --filter @dlh/desktop exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @dlh/desktop test:e2e --project=${{ matrix.browser }}

      # Traces and the HTML report of a red e2e run, to diagnose it without
      # reproducing it (npx playwright show-trace <trace.zip>).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://dlh:dlh@127.0.0.1:54329/dlh_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlh
          POSTGRES_PASSWORD: dlh
          POSTGRES_DB: dlh
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dlh -d dlh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both images build with buildx from layers in the Actions cache. Only
      # pushes to main write that cache (uploading it costs more than the build
      # saves); pull requests read main's.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: dlh-api
          load: true
          cache-from: type=gha,scope=dlh-api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=dlh-api' || '' }}

      - name: Smoke-test the API image
        run: |
          docker run -d --name dlh-api --network host \
            -e DATABASE_URL=postgres://dlh:dlh@127.0.0.1:54329/dlh \
            -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci \
            -e ALLOWED_EMAIL=ci@example.test -e PORT=8787 dlh-api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          docker logs dlh-api
          exit 1

      # The same image `pnpm agent:image` builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/agent-runner/Dockerfile
          tags: dlh-agent-runner
          load: true
          cache-from: type=gha,scope=dlh-agent-runner
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=dlh-agent-runner' || '' }}

      # The Docker tests: runs in the runner image with a fake model
      # (apps/agent/test/docker.e2e.test.ts). As root, like the real worker,
      # which gives each run's socket to the container's user only then.
      - run: sudo -E env "PATH=$PATH" pnpm --filter @dlh/agent test:docker
