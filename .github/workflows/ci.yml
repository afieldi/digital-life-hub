name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm --filter @dlh/ui exec playwright install --with-deps webkit chromium
        if: runner.os == 'macOS'

      # Screenshot baselines exist for darwin only. Desktop e2e needs the API and
      # Postgres, so it runs in the server job.
      # Outstanding follow-up: generate Windows baselines, then drop the macOS guard.
      - run: pnpm --filter @dlh/ui test:screens
        if: runner.os == 'macOS'

      # The web bundle must exist before cargo runs (tauri frontendDist).
      - run: pnpm --filter @dlh/desktop build:web
      - run: pnpm --filter @dlh/desktop exec tauri build --no-bundle

  server:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://dlh:dlh@127.0.0.1:54329/dlh_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlh
          POSTGRES_PASSWORD: dlh
          POSTGRES_DB: dlh
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dlh -d dlh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

      - run: pnpm --filter @dlh/desktop exec playwright install --with-deps webkit chromium
      - run: pnpm --filter @dlh/desktop test:e2e

      - run: pnpm --filter @dlh/api docker:build

      - name: Smoke-test the API image
        run: |
          docker run -d --name dlh-api --network host \
            -e DATABASE_URL=postgres://dlh:dlh@127.0.0.1:54329/dlh \
            -e GOOGLE_CLIENT_ID=ci -e GOOGLE_CLIENT_SECRET=ci \
            -e ALLOWED_EMAIL=ci@example.test -e PORT=8787 dlh-api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          docker logs dlh-api
          exit 1
