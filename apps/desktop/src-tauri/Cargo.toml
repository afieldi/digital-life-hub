[package]
name = "digital-life-hub"
version = "0.0.0"
description = "Digital Life Hub"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "digital_life_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Pinned ~2.12 (not caret): ^2.12 would resolve 2.13+ and break the CLI major/minor match.
# Cargo.lock must be committed after the first real build.
[build-dependencies]
tauri-build = { version = "~2.12", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
