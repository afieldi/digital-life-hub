[package]
name = "digital-life-hub"
version = "0.0.0"
description = "Digital Life Hub"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "digital_life_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# tauri is pinned ~2.12 (not caret) to match @tauri-apps/api and the CLI; ^2.12 would
# resolve 2.13+ and break their major/minor match. tauri-build has its own version line
# (2.7.x alongside tauri 2.12), so it takes any 2.x and Cargo.lock holds the exact version.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plugins have their own version lines (opener 2.7, os 2.4 alongside tauri 2.12) and crates.io
# now carries 3.0 alphas, so each is pinned ~ to its stable 2.x minor, matching the npm packages.
tauri-plugin-opener = "~2.7"
tauri-plugin-os = "~2.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
